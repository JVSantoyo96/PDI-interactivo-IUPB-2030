<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pascual Bravo 2030</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Experiencia interactiva del Plan de Desarrollo Institucional 2027–2030 de la Institución Universitaria Pascual Bravo: Formar · Servir · Cuidar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..500&display=swap">
<style>
/* Layout: editorial asimétrico; scroll continuo de 8 experiencias; la arquitectura es un mapa de 4 columnas con panel lateral fijo.
   Paleta derivada de la portada del PDI: violeta institucional, amarillo de portada, azul periwinkle de sus puntos, tinta violeta. */
:root{
  --bg:#FBFAFD; --surface:#FFFFFF; --band:#F3EFF9; --ink:#1C1430; --muted:#5B5270; --line:#E2DAEE; --line-2:#CFC3E2;
  --violet:#6A3C9C; --violet-2:#8E63C2; --violet-soft:#E9E0F5; --on-violet:#FFFFFF;
  --yellow:#F4E7A5; --yellow-strong:#EBCF66; --yellow-ink:#7A5A00; --yellow-soft:#FBF4D3; --peri:#9FB5E6; --peri-ink:#34509E; --peri-soft:#E3EAF8;
  --trans-ink:#2C2340; --trans-soft:#ECE8F2;
  --ok:#2E7D4F; --ok-soft:#E1F1E7; --warn:#8A6200; --warn-soft:#FBF0CC; --bad:#B03A2E; --bad-soft:#F8E1DE;
  --shadow:0 1px 2px rgba(40,20,70,.06),0 8px 24px -12px rgba(40,20,70,.18);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif; --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --wrap:1240px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#130E1C; --surface:#1C1528; --band:#191224; --ink:#F1ECF8; --muted:#B4AAC7; --line:#33294A; --line-2:#463A60;
  --violet:#B796EA; --violet-2:#CDB4F2; --violet-soft:#2C2142; --on-violet:#140C22;
  --yellow:#E8D57E; --yellow-strong:#E8D57E; --yellow-ink:#EFD772; --yellow-soft:#2D2715; --peri:#9FB5E6; --peri-ink:#A9C0F0; --peri-soft:#1E2741;
  --trans-ink:#E6E0F0; --trans-soft:#272036;
  --ok:#7BD3A0; --ok-soft:#163323; --warn:#F0C95A; --warn-soft:#332811; --bad:#F29A8F; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#130E1C; --surface:#1C1528; --band:#191224; --ink:#F1ECF8; --muted:#B4AAC7; --line:#33294A; --line-2:#463A60;
  --violet:#B796EA; --violet-2:#CDB4F2; --violet-soft:#2C2142; --on-violet:#140C22;
  --yellow:#E8D57E; --yellow-strong:#E8D57E; --yellow-ink:#EFD772; --yellow-soft:#2D2715; --peri:#9FB5E6; --peri-ink:#A9C0F0; --peri-soft:#1E2741;
  --trans-ink:#E6E0F0; --trans-soft:#272036;
  --ok:#7BD3A0; --ok-soft:#163323; --warn:#F0C95A; --warn-soft:#332811; --bad:#F29A8F; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark; }

/* Eje → color (siempre acompañado de texto) */
.eje-formar{--ax:var(--violet);--ax-soft:var(--violet-soft);--ax-fill:var(--violet);--ax-on:var(--on-violet)}
.eje-servir{--ax:var(--yellow-ink);--ax-soft:var(--yellow-soft);--ax-fill:var(--yellow-strong);--ax-on:#1C1430}
.eje-cuidar{--ax:var(--peri-ink);--ax-soft:var(--peri-soft);--ax-fill:var(--peri-ink);--ax-on:var(--surface)}
.eje-transversal{--ax:var(--trans-ink);--ax-soft:var(--trans-soft);--ax-fill:var(--trans-ink);--ax-on:var(--surface)}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--violet)}
:focus-visible{outline:3px solid var(--violet-2);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px}
.skip:focus{left:16px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.fine{font-size:13px;color:var(--muted);line-height:1.5}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-n{color:var(--violet);font-weight:600}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{border-color:var(--violet)}
.btn-primary{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.btn-primary:hover{background:var(--violet-2);border-color:var(--violet-2)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 12px;font-size:13px;font-weight:500}
.btn-lg{padding:14px 24px;font-size:16px}
.btn-link{border:0;background:none;padding:6px 0;color:var(--violet);font-weight:600}
.btn-link:hover{text-decoration:underline}
.btn[disabled]{cursor:not-allowed;opacity:.65;border-style:dashed}

/* Códigos D/OE/E/P */
.code{font-family:var(--f-mono);font-size:12px;font-weight:600;display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface);line-height:1.4;white-space:nowrap}
.code-oe,.code-e{color:var(--ax,var(--violet));border-color:color-mix(in srgb,var(--ax,var(--violet)) 45%,transparent);background:var(--ax-soft,var(--violet-soft))}
.code-d{color:var(--ink);border-color:var(--ink);background:transparent}
.code-p{color:var(--muted)}
.code-btn{cursor:pointer;transition:transform .15s}
.code-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.code.hl{background:var(--ax-fill);color:var(--ax-on);border-color:var(--ax-fill)}
.leads{margin-top:10px;font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.b-crítica{background:var(--bad-soft);color:var(--bad)}
.b-tensión{background:var(--warn-soft);color:var(--warn)}
.b-guarda{background:var(--peri-soft);color:var(--peri-ink)}

/* Glosario */
.term-wrap{position:relative;display:inline}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--violet-2);text-underline-offset:3px;cursor:help;display:inline}
.term-q{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:3px;border-radius:50%;font:600 10px/1 var(--f-mono);background:var(--violet-soft);color:var(--violet);vertical-align:2px}
.term-pop{position:fixed;z-index:80;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font:400 14px/1.5 var(--f-body);text-transform:none;letter-spacing:0;box-shadow:var(--shadow);text-align:left}

/* Navegación */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:20px;height:60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand img{height:34px;width:auto}
.brand-mark{display:grid;grid-template-columns:repeat(3,7px);gap:3px}
.brand-mark i{width:7px;height:22px;border-radius:2px;background:var(--violet)}
.brand-mark i:nth-child(2){background:var(--yellow);height:16px;align-self:end}
.brand-mark i:nth-child(3){background:var(--peri)}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t b{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:800;font-size:15px;letter-spacing:.01em}
.brand-t span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nav-scroll{position:relative;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-links{list-style:none;margin:0;padding:0;display:flex;gap:2px;justify-content:flex-end}
.nav-links a{display:flex;align-items:baseline;gap:6px;padding:7px 10px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--ink)}
.nav-links a[aria-current="true"]{color:var(--ink);background:var(--violet-soft)}
.nav-n{font-family:var(--f-mono);font-size:10px;color:var(--violet)}
.nav-prog{height:2px;background:transparent}
.nav-prog span{display:block;height:100%;background:var(--violet);transform-origin:0 50%;transform:scaleX(0)}
@media (max-width:1100px){.nav-links{justify-content:flex-start}.nav-n{display:none}}

/* 01 · Hero */
.hero{position:relative;overflow:hidden;padding-block:56px 72px;border-bottom:1px solid var(--line)}
.hero-grid{position:absolute;left:0;top:0;width:52%;height:100%;opacity:.55;pointer-events:none}
.hero-grid line{stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center}
.hero-eyebrow .sep{width:28px;height:1px;background:var(--line-2)}
.hero-axes{display:flex;flex-direction:column;margin-top:22px;font-family:var(--f-display);font-weight:850;line-height:.86;letter-spacing:-.01em;font-size:clamp(56px,8.6vw,124px);text-transform:uppercase}
.ax{display:block;font-variation-settings:"wdth" 125;animation:axIn .9s cubic-bezier(.2,.7,.1,1) both}
.ax-f{color:var(--violet)}
.ax-s{color:transparent;-webkit-text-stroke:2px var(--violet);animation-delay:.12s;padding-left:.5em}
.ax-c{color:var(--ink);animation-delay:.24s;font-variation-settings:"wdth" 110}
@keyframes axIn{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.hero-head{font-family:var(--f-serif);font-size:clamp(21px,2.1vw,27px);line-height:1.35;margin-top:30px;max-width:30em;text-wrap:pretty}
.hero-lede{color:var(--muted);margin-top:16px;max-width:36em;font-size:17px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-status{display:flex;gap:8px;align-items:center;margin-top:22px;font-size:13px;color:var(--muted)}
.hero-status .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft);flex:none}
.hero-visual{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:1fr auto;gap:18px 8px;align-items:center}
.hero-visual::before{content:"";position:absolute;inset:-24px -40px -24px 60px;background:var(--yellow-soft);clip-path:polygon(28px 0,100% 0,100% 100%,0 100%,0 46%,22px 40%,0 34%,0 28px);z-index:0}
.hero-photo{position:relative;z-index:1;margin:0;grid-row:1 / span 2;width:clamp(150px,15vw,200px)}
.hero-photo img{display:block;width:100%;height:clamp(330px,34vw,460px);object-fit:cover;object-position:50% 20%;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px)}
.hero-photo figcaption{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:8px;letter-spacing:.02em}
.hero-orbits{position:relative;z-index:1}
.orbits{width:100%;height:auto;display:block;overflow:visible}
.orb{fill:none;stroke-width:2.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.4,0,.2,1) forwards}
.o-formar{stroke:var(--violet);fill:var(--violet)}
.o-servir{stroke:var(--yellow-ink);fill:var(--yellow-ink)}
.o-cuidar{stroke:var(--peri-ink);fill:var(--peri-ink)}
ellipse.orb{fill:none}
.orb-core{fill:var(--ink)}
.orb-core-t{fill:var(--bg);font:600 15px var(--f-mono)}
.orb-l{font:800 17px var(--f-display);font-variation-settings:"wdth" 115;text-transform:uppercase;letter-spacing:.04em;stroke:none}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-figures{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;grid-column:2}
.hero-figures div{display:flex;align-items:baseline;gap:5px}
.hero-figures dt{font-family:var(--f-display);font-variation-settings:"wdth" 120;font-weight:800;font-size:24px;color:var(--violet)}
.hero-figures dd{margin:0;font-size:13px;color:var(--muted)}

/* Secciones */
.sec{padding-block:96px}
.sec-head{max-width:780px;margin-bottom:40px}
.sec-head h2{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:780;font-size:clamp(32px,4.2vw,52px);line-height:1.02;letter-spacing:-.015em;margin-top:14px}
.sec-lede{font-size:18px;color:var(--muted);margin-top:16px;max-width:42em}
.sec-head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;max-width:none;flex-wrap:wrap}
.sec-head-row>div:first-child{max-width:760px}
.cp-k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}

/* 02 · Origen */
.sec-origen{background:var(--bg)}
.conv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.conv-tabs{display:contents}
.conv-tab{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s,transform .2s;position:relative}
.conv-tab:hover{border-color:var(--violet-2)}
.conv-tab[aria-selected="true"]{border-color:var(--violet);background:var(--violet-soft)}
.conv-tab.is-result[aria-selected="true"]{background:var(--violet);color:var(--on-violet)}
.conv-tab.is-result[aria-selected="true"] .conv-k,.conv-tab.is-result[aria-selected="true"] .conv-n{color:var(--on-violet)}
.conv-n{font-family:var(--f-mono);font-size:12px;color:var(--violet);font-weight:600}
.conv-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.conv-t{font-family:var(--f-display);font-variation-settings:"wdth" 104;font-weight:700;font-size:18px;line-height:1.2}
.conv-lines{grid-column:1 / -1;width:100%;height:48px;display:block}
.conv-path{fill:none;stroke:var(--line-2);stroke-width:1.5;transition:stroke .3s}
.conv-path.on{stroke:var(--violet);stroke-width:2.5}
.conv-panel{grid-column:1 / -1;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:32px;animation:panelIn .35s ease both}
@keyframes panelIn{from{transform:translateY(8px)}to{transform:none}}
.cp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:44px}
.cp-intro h3{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:760;font-size:26px;line-height:1.1;margin-bottom:12px}
.cp-intro>p{color:var(--muted);margin-bottom:18px}
.cp-data{display:flex;flex-direction:column;gap:18px;min-width:0}
.strength{border-left:3px solid var(--yellow-ink);padding:4px 0 4px 16px;margin:6px 0 18px}
.strength-k{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow-ink);margin-bottom:4px}
.cmp{margin:0}
.cmp-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:650;margin-bottom:8px}
.cmp-row{display:grid;grid-template-columns:104px minmax(0,1fr) 68px;gap:10px;align-items:center;font-size:13.5px;margin-top:5px}
.cmp-k{color:var(--muted)}
.cmp-bar{height:12px;background:var(--band);border-radius:3px;overflow:hidden}
.cmp-fill{display:block;height:100%;border-radius:3px;transition:width .6s ease}
.cmp-fill.pb{background:var(--violet)}
.cmp-fill.nal{background:var(--line-2)}
.cmp-v{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.cmp-src{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.cp-datum{padding-bottom:16px;border-bottom:1px solid var(--line)}
.cp-datum:last-child{border-bottom:0}
.knots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.knots li::marker{font-family:var(--f-mono);color:var(--violet)}
.forces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.forces li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.force-n{font-family:var(--f-mono);font-size:12px;color:var(--violet);font-weight:600}
.force-t{font-weight:550}
.force-c{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 16px}
.figs div{border-top:2px solid var(--violet);padding-top:8px}
.figs dt{font-family:var(--f-display);font-variation-settings:"wdth" 120;font-weight:800;font-size:30px;line-height:1;color:var(--violet)}
.figs dd{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.prios{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:10px}
.prios li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border-radius:10px;background:var(--band)}
.prios b{font-weight:650}
.prios span:not(.force-c){grid-column:1;font-size:13.5px;color:var(--muted)}
.prios .force-c{grid-column:2;grid-row:1 / span 2;align-self:center}
.mandates{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.mandates li{display:flex;gap:10px;font-size:14.5px;line-height:1.4}
.mandates span{font-family:var(--f-mono);font-size:11px;color:var(--violet);font-weight:600;padding-top:2px;flex:none}
.quote{font-family:var(--f-serif);font-style:italic;font-size:19px;margin-top:6px}
.cp-decide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:44px;align-items:center}
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.chain li{display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-radius:10px;background:var(--violet-soft);animation:chainIn .45s ease both;animation-delay:calc(var(--i) * 70ms);position:relative}
.chain li:not(:last-child)::after{content:"→";position:absolute;right:-9px;top:18px;color:var(--violet);font-size:14px;z-index:1}
.chain b{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:850;font-size:40px;line-height:1;color:var(--violet)}
.chain-t{font-weight:650}
.chain-d{font-size:12.5px;color:var(--muted);line-height:1.35}
@keyframes chainIn{from{transform:translateY(10px)}to{transform:none}}
.statement{font-family:var(--f-serif);font-size:clamp(22px,2.6vw,32px);line-height:1.3;max-width:24em;margin-top:56px;padding-left:22px;border-left:4px solid var(--yellow)}

/* 03 · Disrupciones */
.sec-dz{background:var(--band)}
.dz{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.dz-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:84px}
.dz-tab{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;transition:background .2s,border-color .2s}
.dz-tab:hover{background:var(--surface)}
.dz-tab[aria-selected="true"]{background:var(--surface);border-color:var(--line-2);box-shadow:var(--shadow)}
.dz-id{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);border:1px solid var(--line-2);border-radius:7px;text-align:center;padding:3px 0}
.dz-tab[aria-selected="true"] .dz-id{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dz-name{font-weight:600;font-size:15px;line-height:1.3}
.dz-stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px;position:relative;overflow:hidden;min-width:0}
.dz-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:26px}
.dz-big{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:900;font-size:76px;line-height:.8;color:var(--violet-soft);-webkit-text-stroke:1.5px var(--violet);flex:none}
.dz-head h3{font-family:var(--f-display);font-variation-settings:"wdth" 106;font-weight:760;font-size:clamp(22px,2.4vw,30px);line-height:1.12}
.shift{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1.25fr);align-items:stretch;gap:0}
.shift-a,.shift-b{border-radius:12px;padding:20px 22px}
.shift-a{background:var(--band);color:var(--muted);animation:shiftA .7s ease both}
.shift-b{background:var(--violet);color:var(--on-violet);animation:shiftB .6s .25s cubic-bezier(.2,.7,.1,1) both}
.shift-b p:last-child{font-family:var(--f-serif);font-size:19px;line-height:1.4}
.shift-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.85}
.shift-arrow{display:grid;place-items:center}
.shift-arrow svg{width:46px;height:20px;fill:none;stroke:var(--violet);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.shift-arrow path{stroke-dasharray:80;stroke-dashoffset:80;animation:arrow .5s .2s ease forwards}
@keyframes arrow{to{stroke-dashoffset:0}}
@keyframes shiftA{from{transform:translateX(14px)}to{transform:none}}
@keyframes shiftB{from{transform:translateX(-16px);opacity:.2}to{transform:none;opacity:1}}
.dz-why{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}
.dz-not{margin-top:22px;padding:12px 16px;border-radius:10px;background:var(--yellow-soft);font-size:15px}
.dz-not span{font-family:var(--f-mono);font-weight:600;color:var(--yellow-ink);margin-right:6px}
.dz-links{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.dz-links .cp-k{margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipwrap{display:inline-flex;align-items:center;gap:4px}
.chipwrap small{font-size:11px;color:var(--muted)}
.dz-pager{position:absolute;top:22px;right:22px;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* 04 · Arquitectura */
.view-toggle,.mx-by{display:inline-flex;padding:4px;border-radius:999px;background:var(--band);border:1px solid var(--line)}
.seg{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.simple-axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.axis{border-top:6px solid var(--ax);background:var(--surface);border-radius:4px 4px var(--r) var(--r);padding:22px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.axis-name{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:850;font-size:34px;text-transform:uppercase;color:var(--ax);line-height:1}
.axis-sense{color:var(--muted);font-size:14.5px;margin:10px 0 18px;min-height:3em}
.axis-oes{display:flex;flex-direction:column;gap:10px}
.oe-card{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--ax-soft);border-radius:10px;padding:16px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.oe-card:hover{border-color:var(--ax);transform:translateY(-2px);box-shadow:var(--shadow)}
.oe-id{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ax)}
.oe-name{font-family:var(--f-display);font-variation-settings:"wdth" 104;font-weight:720;font-size:19px;line-height:1.2}
.oe-sum{font-size:14px;color:var(--muted)}
.oe-go{font-size:13px;font-weight:600;color:var(--ax);margin-top:6px}
.axis-trans{margin-top:16px;position:relative}
.trans-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:18px}
.trans-flow span{border-left:2px dashed var(--line-2);margin-left:50%}
.oe-wide{width:100%;background:var(--trans-soft);border-left:6px solid var(--trans-ink)}
.simple-note{margin-top:22px;max-width:56em;color:var(--muted)}

.explore.is-wide{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.amap{position:relative;display:grid;grid-template-columns:minmax(124px,.75fr) minmax(0,2.5fr) minmax(140px,.85fr);column-gap:44px;align-items:stretch;padding:8px 0}
.amap-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.ln{fill:none;stroke:var(--violet);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease forwards;opacity:.85}
.ln-conexion,.ln-habilitador{stroke-dasharray:4 4;stroke-dashoffset:0;animation:fadeIn .5s ease both;opacity:.7}
@keyframes fadeIn{from{opacity:0}}
.amap-col{display:flex;flex-direction:column;position:relative;z-index:1;min-width:0}
.col-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);font-weight:600;margin-bottom:10px;display:flex;flex-direction:column;gap:2px;min-height:34px}
.col-h span{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;font-family:var(--f-body);font-size:12px}
.col-stack{display:flex;flex-direction:column;gap:6px;flex:1}
.col-stack.spread{justify-content:space-around}
.amap-mid{position:relative;z-index:1;min-width:0}
.mid-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:40px}
.mid-group{margin-bottom:10px}
.mid-eje{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:850;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ax);margin:6px 0 6px;display:flex;align-items:baseline;gap:8px}
.mid-eje em{font-family:var(--f-body);font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.mid-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:40px;align-items:center;margin-bottom:8px}
.mid-es{display:flex;flex-direction:column;gap:6px}
.mn{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.3;cursor:pointer;transition:opacity .25s,background .25s,border-color .25s,color .25s,box-shadow .25s;position:relative}
.mn:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.mn-id{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);flex:none;min-width:24px;padding-top:1px}
.mn-t{min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.mn-oe{border-left:4px solid var(--ax);padding:11px 12px;font-size:14px;font-weight:600;background:var(--ax-soft)}
.mn-oe .mn-id{color:var(--ax)}
.mn-e .mn-id{color:var(--ax)}
.mn-d{border-color:var(--line-2);border-style:solid}
.mn-d .mn-id{color:var(--ink)}
.mn-p{border-radius:7px}
.mn.is-sel{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.mn.is-sel .mn-id{color:var(--bg)}
.mn-oe.is-sel,.mn-e.is-sel{background:var(--ax-fill);border-color:var(--ax-fill);color:var(--ax-on)}
.mn-oe.is-sel .mn-id,.mn-e.is-sel .mn-id{color:var(--ax-on)}
.mn.is-rel{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}
.mn-oe.is-rel,.mn-e.is-rel{border-color:var(--ax);box-shadow:0 0 0 1px var(--ax) inset}
.mn.is-dim{opacity:.3}
.mn.is-dim:hover{opacity:.75}

.panel{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);overscroll-behavior:contain}
.is-narrow .panel{position:static;max-height:none;margin-top:16px;scroll-margin-top:80px}
.panel-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px}
.panel-head h3{font-family:var(--f-display);font-variation-settings:"wdth" 104;font-weight:740;font-size:22px;line-height:1.15}
.panel-nav{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.panel-lead{font-family:var(--f-serif);font-size:17px;line-height:1.45;margin-top:12px}
.panel-block{margin-top:18px}
.panel-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-bottom:8px;font-weight:600}
.panel-body>p:not(.panel-lead):not(.fine){margin-top:10px}
.panel-note{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--yellow-soft)}
.refs{display:flex;flex-direction:column;gap:5px}
.refchip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13.5px;line-height:1.3;cursor:pointer;transition:border-color .2s,background .2s}
.refchip:hover{border-color:var(--ax,var(--violet));background:var(--ax-soft,var(--violet-soft))}
.refchip-id{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--ax,var(--muted))}
.refchip.k-d .refchip-id{color:var(--ink)}
.refchip-arrow{color:var(--muted)}
.panel-es{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.panel-es button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;cursor:pointer;transition:border-color .2s}
.panel-es button:hover{border-color:var(--violet)}
.pe-id{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--violet)}
.panel-es b{display:block;font-size:14px}
.panel-es span span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.panel-ind{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.panel-ind li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px}
.panel-ind span{font-family:var(--f-mono);font-size:12px;color:var(--violet);font-weight:600}
.panel-la{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.panel-shift{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.panel-shift p{padding:10px 12px;border-radius:8px;background:var(--band);font-size:14px}
.panel-shift p:last-child{background:var(--violet-soft)}
.panel-shift span{display:block;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.panel-empty p{margin-bottom:12px}
.legend{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.legend li{display:flex;gap:10px;align-items:center}
.lg{width:22px;height:14px;border-radius:4px;border:1px solid var(--line-2);flex:none}
.lg-d{background:transparent;border-color:var(--ink)}
.lg-oe{background:var(--violet-soft);border-left:4px solid var(--violet)}
.lg-e{background:var(--surface);border-color:var(--violet)}
.lg-p{background:var(--surface);border-radius:2px}
.lg-line{height:0;border:0;border-top:2px solid var(--violet);border-radius:0}
.lg-line.dashed{border-top-style:dashed}
.panel-try{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.arch-src{margin-top:24px;max-width:60em}

.mx{display:flex;flex-direction:column;gap:14px}
.mx-by{align-self:flex-start;max-width:100%;overflow-x:auto}
.mx-chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.mx-chip{flex:0 0 auto;width:min(220px,62vw);display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--ax-soft,var(--surface));border-left:4px solid var(--ax,var(--line-2));border-radius:10px;padding:10px 12px;cursor:pointer;scroll-snap-align:start;font-size:14px;line-height:1.3}
.mx-chip b{font-family:var(--f-mono);font-size:12px;color:var(--ax,var(--muted))}
.mx-chip.k-d{border-left-color:var(--ink)}
.mx-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mx-chip.on b{color:var(--bg)}

/* 05 · Proyectos */
.sec-proj{background:var(--band)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.f-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.f-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100px}
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.fchip:hover{border-color:var(--ax,var(--violet))}
.fchip.on{background:var(--ax-fill,var(--ink));border-color:var(--ax-fill,var(--ink));color:var(--ax-on,var(--bg))}
.fchip-oe{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:6px 11px}
.f-count{font-size:14px;color:var(--muted);margin-bottom:20px}
.pgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard-li{display:flex;animation:cardIn .35s ease both}
@keyframes cardIn{from{transform:translateY(8px) scale(.99)}to{transform:none}}
.pcard{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.pcard:hover{border-color:var(--violet);box-shadow:var(--shadow);transform:translateY(-2px)}
.pc-top{display:flex;justify-content:space-between;align-items:center}
.pc-n{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:850;font-size:30px;line-height:1;color:var(--violet)}
.pc-more{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:18px;color:var(--muted);transition:background .2s,color .2s}
.pcard:hover .pc-more{background:var(--violet);color:var(--on-violet);border-color:var(--violet)}
.pc-name{font-family:var(--f-display);font-variation-settings:"wdth" 102;font-weight:720;font-size:18px;line-height:1.22}
.pc-row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.42;color:var(--muted)}
.pc-k{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);padding-top:2px}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.drawer-wrap{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;justify-content:flex-end;animation:fadeIn .2s ease both}
.drawer{width:min(520px,100%);height:100%;overflow:auto;background:var(--surface);padding:24px 28px calc(28px + env(safe-area-inset-bottom,0px));padding-right:max(28px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);animation:slideIn .3s cubic-bezier(.2,.7,.1,1) both;display:flex;flex-direction:column;gap:4px}
.drawer>.btn-primary{align-self:flex-start;margin-top:22px}
@keyframes slideIn{from{transform:translateX(40px)}to{transform:none}}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-top:env(safe-area-inset-top,0px)}
.drawer-n{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:850;font-size:40px;color:var(--violet)}
.drawer h3{font-family:var(--f-display);font-variation-settings:"wdth" 104;font-weight:740;font-size:24px;line-height:1.15;margin-top:6px}
.drawer-es{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.drawer-es li{display:flex;gap:8px;align-items:flex-start}

/* 06 · Resultados */
.toc-chain{list-style:none;margin:0 0 56px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tc{padding:18px;background:var(--surface);border-right:1px solid var(--line)}
.tc:last-child{border-right:0}
.tc-3{background:var(--violet);color:var(--on-violet)}
.tc-3 .tc-k{color:var(--on-violet)}
.tc-4{background:var(--yellow-soft)}
.tc-k{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--violet);margin-bottom:8px}
.tc-v{font-size:14.5px;line-height:1.45}
.res-h{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:760;font-size:26px;margin-bottom:16px}
.res-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.res{border-bottom:1px solid var(--line)}
.res-btn{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) 32px;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:18px 4px;cursor:pointer}
.res-oe{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ax);border:1px solid var(--ax);border-radius:6px;padding:2px 0;text-align:center}
.res-t{font-family:var(--f-display);font-variation-settings:"wdth" 104;font-weight:680;font-size:clamp(17px,1.8vw,21px);line-height:1.25}
.res-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-size:18px}
.res.open .res-ic{background:var(--ax-fill);color:var(--ax-on);border-color:var(--ax-fill)}
.res-body{padding:0 4px 24px 72px;animation:panelIn .3s ease both}
.res-body>p{max-width:46em;margin-bottom:14px;font-family:var(--f-serif);font-size:17px}
.ind-t{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
.ind-t th,.ind-t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ind-t thead th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line-2)}
.ind-t tbody th{font-weight:550;width:46%}
.ind-t small{display:block;color:var(--muted);font-weight:400;margin-top:3px}
.ind-t td:last-child{color:var(--violet);font-weight:600}
.ind-n{font-family:var(--f-mono);font-size:12px;color:var(--violet);margin-right:8px}
.guard{margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:32px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.guard h3{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:760;font-size:26px;line-height:1.12;margin:10px 0}
.guard-copy>p:last-child{color:var(--muted)}
.guard-viz{margin:0}
.guard-rule{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.guard-rule li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:10px;font-size:14px}
.guard-rule b{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.guard-rule b::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.g-ok{background:var(--ok-soft)} .g-ok b{color:var(--ok)}
.g-warn{background:var(--warn-soft)} .g-warn b{color:var(--warn)}
.g-bad{background:var(--bad-soft)} .g-bad b{color:var(--bad)}
.guard-viz figcaption{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:10px}
.res-note{margin-top:28px;max-width:62em}

/* 07 · Para ti */
.sec-you{background:var(--ink);color:var(--bg)}
.sec-you .eyebrow,.sec-you .fine{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.sec-you .sec-n{color:var(--yellow)}
.you-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.you-btn{border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);background:transparent;color:var(--bg);border-radius:999px;padding:12px 20px;font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:650;font-size:17px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.you-btn:hover{border-color:var(--yellow)}
.you-btn.on{background:var(--yellow);color:#1C1430;border-color:var(--yellow)}
.you-intro{font-family:var(--f-serif);font-size:clamp(22px,2.4vw,30px);line-height:1.3;max-width:26em;margin-bottom:28px}
.you-list{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.you-list li{border-top:2px solid var(--yellow);padding:16px 0 0;animation:chainIn .45s ease both;animation-delay:calc(var(--i) * 80ms)}
.you-t{font-family:var(--f-display);font-variation-settings:"wdth" 104;font-weight:700;font-size:18px;line-height:1.25;margin-bottom:8px}
.you-d{font-size:14.5px;color:color-mix(in srgb,var(--bg) 78%,transparent)}
.you-refs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.sec-you .code{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.sec-you .code-btn:hover{background:var(--yellow);color:#1C1430;border-color:var(--yellow)}
.sec-you :focus-visible{outline-color:var(--yellow)}

/* 08 · Plan vivo */
.loop{list-style:none;margin:0 0 48px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:l}
.loop li{position:relative;padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.loop li:not(:last-child)::after{content:"";position:absolute;right:-12px;top:34px;width:10px;height:10px;border-top:2px solid var(--violet);border-right:2px solid var(--violet);transform:rotate(45deg);z-index:1}
.loop-n{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:850;font-size:28px;color:var(--violet);line-height:1}
.loop-t{font-weight:700;margin:10px 0 6px;line-height:1.3}
.loop-d{font-size:14px;color:var(--muted)}
.cadence{margin-bottom:56px}
.cad{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:2px solid var(--ink)}
.cad li{padding:14px 14px 0 0;display:flex;flex-direction:column;gap:6px;position:relative}
.cad li::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.cad li:nth-child(n+5)::before{background:var(--yellow);border-color:var(--yellow-ink)}
.cad b{font-family:var(--f-mono);font-size:13px;font-weight:600;margin-top:4px}
.cad-q{font-size:14px;line-height:1.4}
.cad-i{font-size:12.5px;color:var(--muted)}
.cta-final{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:36px;border-radius:20px;background:var(--violet-soft);border:1px solid var(--line)}
.cta-final h3{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:800;font-size:clamp(24px,2.8vw,34px);line-height:1.08;margin-bottom:10px}
.cta-final p{color:var(--muted);max-width:40em}
.cta-pending{display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:300px}

.foot{border-top:1px solid var(--line);padding-block:40px calc(40px + env(safe-area-inset-bottom,0px))}
.foot-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:32px;font-size:14px;color:var(--muted)}
.foot-b{font-weight:700;color:var(--ink);margin-bottom:6px}
.foot-in .fine p+p{margin-top:8px}


/* Temas transversales y modos intermedios de la red */
.kw{display:flex;align-items:center;gap:10px 16px;margin:0 0 22px;padding:10px 12px;border-radius:14px;background:var(--band);border:1px solid var(--line);min-width:0}
.kw-form{display:flex;align-items:center;gap:10px;flex:none}
.kw-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kw-input{width:210px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px}
.kw-input:focus{outline:2px solid var(--violet-2);outline-offset:1px}
.kw-row{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);padding-right:36px}
.kw-chip{flex:none;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:550;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.kw-chip:hover{border-color:var(--violet)}
.kw-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kw-free{border-style:dashed;color:var(--violet)}
.panel-marco{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.simple-cta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:22px}
.simple-cta span{color:var(--muted);font-size:14.5px}
.explore.is-mid{display:block}
.is-mid .panel{position:static;max-height:none;margin-top:18px}
.is-mid.has-sel .panel{position:sticky;top:auto;bottom:12px;max-height:34vh;z-index:5;box-shadow:0 -6px 30px -12px rgba(40,20,70,.35)}
.net-toggle{align-self:flex-start;margin-top:12px}
.amap-scroll{overflow-x:auto;margin-top:14px;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.amap-scroll .amap{min-width:940px}
.foot-adj{margin-top:10px}
@media (max-width:900px){.kw{flex-direction:column;align-items:stretch}.kw-form{flex-wrap:wrap}.kw-input{width:100%}}

/* Responsive */
@media (max-width:1100px){
  .hero-in{grid-template-columns:1fr;gap:40px}
  .hero-visual{max-width:620px}
  .cp-grid,.cp-decide{grid-template-columns:1fr;gap:28px}
  .dz{grid-template-columns:1fr}
  .dz-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .dz-tab{flex:0 0 auto;width:200px;padding:10px 12px;scroll-snap-align:start;background:color-mix(in srgb,var(--surface) 50%,transparent)}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toc-chain{grid-template-columns:1fr}
  .tc{border-right:0;border-bottom:1px solid var(--line)}
  .cad{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:22px}
  .loop{grid-template-columns:repeat(2,minmax(0,1fr))}
  .loop li:nth-child(2)::after{display:none}
  .chain{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:760px){
  .sec{padding-block:64px}
  .hero{padding-block:36px 52px}
  .hero-grid{width:100%;opacity:.35}
  .hero-visual{grid-template-columns:120px minmax(0,1fr);gap:14px}
  .hero-visual::before{inset:-14px -20px -14px 40px}
  .hero-photo{width:120px}
  .hero-photo img{height:260px}
  .hero-photo figcaption{display:none}
  .orb-l{font-size:20px}
  .hero-figures{grid-column:1 / -1}
  .ax-s{-webkit-text-stroke-width:1.5px}
  .sec-lede{font-size:16.5px}
  .conv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .conv-lines{display:none}
  .conv-panel{margin-top:6px;padding:20px}
  .conv-t{font-size:15.5px}
  .mandates{grid-template-columns:1fr}
  .forces li{grid-template-columns:22px minmax(0,1fr)}
  .force-c{grid-column:2;justify-content:flex-start}
  .chain{grid-template-columns:1fr 1fr}
  .chain li::after{display:none}
  .chain li:last-child{grid-column:1 / -1}
  .dz-stage{padding:22px}
  .dz-big{font-size:52px}
  .dz-pager{position:static;justify-content:flex-end;margin-top:18px}
  .shift{grid-template-columns:1fr}
  .shift-arrow{height:40px}
  .shift-arrow svg{transform:rotate(90deg)}
  .dz-why{grid-template-columns:1fr;gap:18px}
  .simple-axes{grid-template-columns:1fr}
  .axis-sense{min-height:0}
  .trans-flow{display:none}
  .pgrid{grid-template-columns:1fr}
  .f-k{width:100%}
  .res-btn{grid-template-columns:44px minmax(0,1fr) 30px}
  .res-body{padding-left:4px}
  .ind-t thead{display:none}
  .ind-t tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
  .ind-t th,.ind-t td{display:block;border:0;padding:3px 0;width:auto!important}
  .ind-t td::before{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block}
  .ind-t td:nth-of-type(1)::before{content:"Línea base disponible"}
  .ind-t td:nth-of-type(2)::before{content:"Meta 2030 propuesta"}
  .guard{grid-template-columns:1fr;padding:22px;gap:22px}
  .guard-rule li{grid-template-columns:1fr;gap:4px}
  .loop{grid-template-columns:1fr}
  .loop li::after{display:none}
  .cad{grid-template-columns:1fr 1fr}
  .cta-final{grid-template-columns:1fr;padding:24px}
  .foot-in{grid-template-columns:1fr}
  .statement{margin-top:40px}
  .cmp-row{grid-template-columns:86px minmax(0,1fr) 60px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .orb,.ln,.shift-arrow path{stroke-dashoffset:0!important}
}
</style>

(function () {

    const E2P = {}; DATA.estrategias.forEach(e => { E2P[e.id] = new Set(e.proyectos); });

    Object.entries(E2P).forEach(([e, ps]) => ps.forEach(p => P2E[p].add(e)));

    });

  const norm = t => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  // Elementos relacionados y líneas para una selección
  function relate(sel) {
    const R = { D: new Set(), OE: new Set(), E: new Set(), P: new Set() }; const lines = [];
    if (!sel) return { R, lines };
    const k = kindOf(sel);
    const add = (id) => { const s = R[kindOf(id)]; if (s) s.add(id); };
    const line = (a, b, t) => { const [x, y] = colOf[kindOf(a)] <= colOf[kindOf(b)] ? [a, b] : [b, a]; lines.push({ a: x, b: y, t: t || "core" }); };
    add(sel);
    if (k === "OE") {
      (G.OE2D[sel] || []).forEach(r => { add(r.d); line(r.d, sel, r.tipo); });
      G.OE2E[sel].forEach(e => { add(e); line(sel, e); G.E2P[e].forEach(p => { add(p); line(e, p); }); });
      byId && DATA.proyectos.filter(p => p.apoyoObjetivos.includes(sel)).forEach(p => { add(p.id); });
    } else if (k === "E") {
      const oe = byId[sel].oe; add(oe); line(oe, sel);
      (G.E2D[sel] || []).forEach(d => { add(d); const r = (G.OE2D[oe] || []).find(x => x.d === d); line(d, oe, r ? r.tipo : "core"); });
      G.E2P[sel].forEach(p => { add(p); line(sel, p); });
    } else if (k === "P") {
      G.P2E[sel].forEach(e => { add(e); line(e, sel); const oe = byId[e].oe; add(oe); line(oe, e); });
      byId[sel].apoyoObjetivos.forEach(o => add(o));
    } else if (k === "K" || k === "Q") {
      const set = new Set(k === "K" ? byId[sel].donde : searchPlan(sel.slice(2))); set.forEach(add);
      DATA.disrupcionObjetivo.forEach(r => { if (set.has(r.d) && set.has(r.oe)) line(r.d, r.oe, r.tipo); });
      DATA.estrategias.forEach(e => { if (set.has(e.id) && set.has(e.oe)) line(e.oe, e.id); });
      Object.entries(G.E2P).forEach(([e, ps]) => { if (set.has(e)) ps.forEach(p => { if (set.has(p)) line(e, p); }); });
    } else if (k === "D") {
      (G.D2OE[sel] || []).forEach(r => { add(r.oe); line(sel, r.oe, r.tipo); });
      (DATA.disrupcionEstrategias[sel] || []).forEach(e => { add(e); line(byId[e].oe, e); });
    }
    return { R, lines };
  }

  /* ---------------- Utilidades de interfaz ---------------- */
  function useMedia(q) {
    const get = () => (typeof window !== "undefined" && window.matchMedia ? window.matchMedia(q).matches : false);
    const [m, setM] = useState(get);
    useEffect(() => { const mq = window.matchMedia(q); const h = () => setM(mq.matches); h(); mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h); return () => { mq.removeEventListener ? mq.removeEventListener("change", h) : mq.removeListener(h); }; }, [q]);
    return m;
  }
  const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scrollToId = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" }); };

  function Term({ k, children }) {
    const [open, setOpen] = useState(false); const btn = useRef(null); const [pos, setPos] = useState(null);
    const def = DATA.glosario[k];
    useEffect(() => {
      if (!open) return;
      const place = () => { const r = btn.current.getBoundingClientRect(); const w = Math.min(300, window.innerWidth - 32); let left = Math.min(Math.max(16, r.left), window.innerWidth - w - 16); setPos({ top: r.bottom + 8, left, width: w }); };
      place();
      const close = (e) => { if (e.type === "keydown" && e.key !== "Escape") return; if (e.type === "pointerdown" && btn.current && btn.current.parentNode.contains(e.target)) return; setOpen(false); };
      window.addEventListener("scroll", place, true); window.addEventListener("resize", place);
      document.addEventListener("pointerdown", close); document.addEventListener("keydown", close);
      return () => { window.removeEventListener("scroll", place, true); window.removeEventListener("resize", place); document.removeEventListener("pointerdown", close); document.removeEventListener("keydown", close); };
    }, [open]);
    return html`<span className="term-wrap"><button type="button" ref=${btn} className="term" aria-expanded=${open} onClick=${() => setOpen(o => !o)}>${children}<span className="term-q" aria-hidden="true">?</span></button>${open && pos && html`<span role="note" className="term-pop" style=${{ top: pos.top + "px", left: pos.left + "px", width: pos.width + "px" }}><strong>${children}.</strong> ${def}</span>`}</span>`;
  }

  function useLines(boxRef, nodes, lines, deps) {
    const [paths, setPaths] = useState([]);
    const compute = useCallback(() => {
      const box = boxRef.current; if (!box) return; const b = box.getBoundingClientRect();
      const out = [];
      lines.forEach((l, i) => {
        const A = nodes.current[l.a], B = nodes.current[l.b]; if (!A || !B) return;
        const ra = A.getBoundingClientRect(), rb = B.getBoundingClientRect();
        const x1 = ra.right - b.left, y1 = ra.top + ra.height / 2 - b.top, x2 = rb.left - b.left, y2 = rb.top + rb.height / 2 - b.top;
        const dx = Math.max(24, (x2 - x1) * 0.55);
        out.push({ key: l.a + "-" + l.b, d: `M${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1 + dx).toFixed(1)} ${y1.toFixed(1)}, ${(x2 - dx).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`, t: l.t, i });
      });
      setPaths(out);
    }, [lines]);
    useLayoutEffect(() => { compute(); }, deps);
    useEffect(() => {
      const box = boxRef.current; if (!box || !window.ResizeObserver) return;
      const ro = new ResizeObserver(() => compute()); ro.observe(box);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(compute);
      return () => ro.disconnect();
    }, [compute]);
    return paths;
  }

      aria-pressed=${on} onClick=${() => go(on ? null : id)} title=${k === "P" ? byId[id].nombre : undefined}>${children}</button>`;
  }

      document.addEventListener("keydown", onKey); document.body.classList.add("noscroll");

        </div>
        <p className="f-count" aria-live="polite">${f === "ALL" ? "12 proyectos. Las etiquetas muestran los objetivos a los que contribuye cada uno." : shown.length + " de 12 proyectos aportan a " + fLabel + "."}</p>
        <ul className="pgrid">
          ${shown.map(p => html`<li key=${p.id} className="pcard-li"><button type="button" className="pcard" onClick=${() => setOpen(p.id)}>
            <span className="pc-top"><span className="pc-n">${p.id.replace("P", "").padStart(2, "0")}</span><span className="pc-more" aria-hidden="true">+</span></span>
            <span className="pc-name">${p.nombre}</span>
            <span className="pc-row"><span className="pc-k">Resuelve</span><span>${p.problema}</span></span>
            <span className="pc-row"><span className="pc-k">Habilita</span><span>${p.habilita}</span></span>
            <span className="pc-tags" aria-label=${"Objetivos: " + G.P2OE[p.id].join(", ")}>${G.P2OE[p.id].map(o => html`<span key=${o} className=${"code code-oe eje-" + byId[o].eje.toLowerCase() + (f === o || (byId[o].eje === f) ? " hl" : "")}>${o}</span>`)}</span>
          </button></li>`)}
        </ul>
      </div>
      <${Drawer} id=${open} onClose=${() => setOpen(null)} toMap=${id => { setOpen(null); setTimeout(() => go(id), 30); }} />
    </section>`;
  }

  /* ---------------- 06 · Resultados ---------------- */
  function Resultados({ go }) {
    const [open, setOpen] = useState("R1");
    return html`<section id="resultados" className="sec sec-res" aria-labelledby="res-t">
      <div className="wrap">
        <header className="sec-head">
          <p className="eyebrow"><span className="sec-n">06</span> Teoría de transformación</p>
          <h2 id="res-t">Lo importante no es solo lo que hacemos. Es lo que cambia.</h2>
          <p className="sec-lede">El Plan formula una hipótesis explícita: si se fortalecen las capacidades y se transforman las prácticas, aumenta la probabilidad de mejorar los resultados. No es una relación automática; por eso se verifica.</p>
        </header>
        <ol className="toc-chain">${DATA.teoria.map((t, i) => html`<li key=${t.k} className=${"tc tc-" + i}><p className="tc-k">${t.k}</p><p className="tc-v">${t.v.join(" · ")}</p></li>`)}</ol>
        <h3 className="res-h">Siete cambios que queremos ver en 2030</h3>
        <div className="res-list">
          ${DATA.resultados.map(r => { const o = byId[r.oe]; const isOpen = open === r.id; return html`<div key=${r.id} className=${"res eje-" + o.eje.toLowerCase() + (isOpen ? " open" : "")}>
            <button type="button" className="res-btn" aria-expanded=${isOpen} aria-controls=${"res-" + r.id} onClick=${() => setOpen(isOpen ? null : r.id)}>
              <span className="res-oe">${r.oe}</span><span className="res-t">${r.titulo}</span><span className="res-ic" aria-hidden="true">${isOpen ? "–" : "+"}</span></button>
            ${isOpen && html`<div className="res-body" id=${"res-" + r.id}>
              <p>${r.texto}</p>
              <table className="ind-t"><caption className="sr">Indicadores asociados a ${r.oe}</caption>
                <thead><tr><th scope="col">Indicador</th><th scope="col">Línea base disponible</th><th scope="col">Meta 2030 propuesta</th></tr></thead>
                <tbody>${r.indicadores.map(i => { const x = byId[i]; return html`<tr key=${i}><th scope="row"><span className="ind-n">${i.replace("I", "")}</span>${x.nombre}${x.guarda && html` <span className="badge b-guarda">guarda</span>`}${x.nota && html`<small>${x.nota}</small>`}</th><td>${x.base}</td><td>${x.meta}</td></tr>`; })}</tbody></table>
              <button type="button" className="btn btn-link" onClick=${() => go(r.oe)}>Ver ${r.oe} en la arquitectura →</button>
            </div>`}
          </div>`; })}
        </div>
        <div className="guard">
          <div className="guard-copy"><p className="eyebrow">Un <${Term} k="guarda">indicador de guarda</${Term}></p>
            <h3>Crecer, pero no más rápido que la capacidad docente</h3>
            <p>El indicador 12 no premia aumentar: vigila un umbral. Si los estudiantes por profesor de tiempo completo superan 55,6, la Institución revisa sus decisiones de crecimiento antes del siguiente periodo de admisión.</p></div>
          <figure className="guard-viz" aria-label="Regla de lectura del indicador de guarda">
            <ol className="guard-rule">
              <li className="g-ok"><b>Verde</b><span>valor igual o inferior a 55,6</span></li>
              <li className="g-warn"><b>Amarillo</b><span>un semestre por encima de 55,6</span></li>
              <li className="g-bad"><b>Rojo</b><span>dos semestres consecutivos por encima de 55,6, o un valor superior a 58</span></li>
            </ol>
            <figcaption>Línea base: 55,6 estudiantes por profesor de tiempo completo (2026).</figcaption>
          </figure>
        </div>
        <p className="fine res-note">Las líneas base y metas del tablero son propuestas técnicas sujetas a confirmación por la Dirección de Planeación y Aseguramiento de la Calidad y los responsables del dato antes de la aprobación integral del PDI. «Por levantar» o «por construir» indica que la medición aún no se ha realizado. El periodo 2027–2030 todavía no está en ejecución: esta sección no muestra avances.</p>
      </div>
    </section>`;
  }

  /* ---------------- 07 · Para ti ---------------- */
  function ParaTi({ go }) {
    const [pid, setPid] = useState("estudiante"); const p = DATA.perfiles.find(x => x.id === pid);
    return html`<section id="para-ti" className="sec sec-you" aria-labelledby="you-t">
      <div className="wrap you-in">
        <header className="sec-head">
          <p className="eyebrow"><span className="sec-n">07</span> ¿Qué significa para mí?</p>
          <h2 id="you-t">Este Plan también habla de ti</h2>
        </header>
        <div className="you-pick" role="radiogroup" aria-label="Elige tu perfil">
          ${DATA.perfiles.map(x => html`<button key=${x.id} type="button" role="radio" aria-checked=${pid === x.id} className=${"you-btn" + (pid === x.id ? " on" : "")} onClick=${() => setPid(x.id)}>${x.etiqueta}</button>`)}
        </div>
        <div className="you-body" key=${pid} aria-live="polite">
          <p className="you-intro">${p.intro}</p>
          <ul className="you-list">${p.conexiones.map((c, i) => html`<li key=${i} style=${{ "--i": i }}><p className="you-t">${c.t}</p><p className="you-d">${c.d}</p><p className="you-refs">${c.ref.map(r => html`<${Code} key=${r} id=${r} onClick=${go} />`)}</p></li>`)}</ul>
          <p className="fine">Son conexiones con apuestas del Plan para ayudarte a ubicarte en él. No constituyen beneficios individuales garantizados ni compromisos distintos de los que el PDI establece.</p>
        </div>
      </div>
    </section>`;
  }

  /* ---------------- 08 · Plan vivo ---------------- */
  function PlanVivo() {
    const url = (DATA.config.pdiDocumentUrl || "").trim();
    const steps = [
      ["Los proyectos movilizan las estrategias", "Cada proyecto ejecuta productos con responsables, cronograma y presupuesto."],
      ["Los indicadores observan resultados", "Un tablero pequeño: 11 indicadores de resultado y 1 de guarda."],
      ["La Institución evalúa y decide", "Dos cortes seguidos en rojo obligan a explicar causas y proponer correcciones al Comité Rectoral."],
      ["La comunidad sigue participando", "Validación por estamentos, devolución pública anual y un observatorio ciudadano del PDI propuesto."]
    ];
    return html`<section id="plan-vivo" className="sec sec-live" aria-labelledby="live-t">
      <div className="wrap">
        <header className="sec-head">
          <p className="eyebrow"><span className="sec-n">08</span> <${Term} k="gobernanza">Gobernanza</${Term}> y seguimiento</p>
          <h2 id="live-t">Una transformación que se construye y se verifica</h2>
          <p className="sec-lede">El PDI es una arquitectura para orientar decisiones y rendir cuentas durante cuatro años. Adaptar no significa cambiar de rumbo cada año: significa conservar el propósito y ajustar medios cuando la evidencia lo exige.</p>
        </header>
        <ol className="loop">${steps.map(([t, d], i) => html`<li key=${t}><span className="loop-n">${i + 1}</span><p className="loop-t">${t}</p><p className="loop-d">${d}</p></li>`)}</ol>
        <div className="cadence">
          <p className="cp-k">Ritmo de seguimiento</p>
          <ol className="cad">${DATA.seguimiento.map(s => html`<li key=${s.f}><b>${s.f}</b><span className="cad-q">${s.q}</span><span className="cad-i">${s.i}</span></li>`)}</ol>
        </div>
        <div className="cta-final">
          <div><h3>Conoce el Plan de Desarrollo completo</h3><p>El documento contiene el diagnóstico, la prospectiva, las matrices de trazabilidad, las fichas del portafolio y el sistema de indicadores.</p></div>
          ${url ? html`<a className="btn btn-primary btn-lg" href=${url} target="_blank" rel="noopener">Conoce el Plan de Desarrollo completo ↗</a>`
              : html`<div className="cta-pending"><button type="button" className="btn btn-lg" disabled aria-describedby="cta-why">Documento completo · enlace pendiente</button><p id="cta-why" className="fine">El enlace al documento oficial se publicará cuando la Institución lo habilite.</p></div>`}
        </div>
      </div>
    </section>`;
  }

  function Footer() {
    return html`<footer className="foot"><div className="wrap foot-in">
      <div><p className="foot-b">${DATA.config.institucion}</p><p>${DATA.config.fuenteDocumento}. ${DATA.config.estadoDocumento}</p><p className="fine foot-adj">${DATA.config.ajustes}</p></div>
      <div className="fine"><p>Cifras diagnósticas: SNIES 2024, SPADIES 2023 y MinCiencias (Convocatoria 894 de 2021), según la radiografía cuantitativa del PDI. Los contrastes con el agregado nacional son señales diagnósticas, no comparaciones causales.</p>
        <p>Relaciones proyecto–estrategia: integran la columna «Proyectos que contribuyen» de las tablas 29 a 35 y la columna de contribución de la tabla 39. Los presupuestos de referencia no se incluyen en esta experiencia.</p></div>
    </div></footer>`;
  }

  /* ---------------- App ---------------- */
  function App() {
    const [sel, setSel] = useState(null); const [view, setView] = useState("sencilla");
    const go = useCallback((id) => { setSel(id); setView("explorar"); setTimeout(() => scrollToId("arquitectura"), 20); }, []);
    return html`<${Fragment}>
      <a className="skip" href="#arquitectura">Saltar a la arquitectura estratégica</a>
      <${Nav} />
      <main>
        <${Hero} />
        <${Origen} go=${go} />
        <${Disrupciones} go=${go} />
        <${Arquitectura} sel=${sel} setSel=${setSel} view=${view} setView=${setView} />
        <${Proyectos} go=${go} />
        <${Resultados} go=${go} />
        <${ParaTi} go=${go} />
        <${PlanVivo} />
      </main>
      <${Footer} />
    </${Fragment}>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();

</script>

</body>
</html>
